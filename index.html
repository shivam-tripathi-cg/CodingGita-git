<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  :root {
    --bg: #F7F6F3;
    --card: #FFFFFF;
    --ink: #1C1B19;
    --muted: #767268;
    --line: #E4E1D9;
    --accent: #2F5D50;
    --accent-hover: #24483E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }

  nav {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 16px 32px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }

  nav a {
    text-decoration: none;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
  }

  nav a:first-child {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
  }

  nav a:first-child::before {
    content: "";
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: var(--accent);
    display: inline-block;
  }

  nav a:not(:first-child) {
    color: var(--muted);
    transition: color 0.15s ease;
  }

  nav a:not(:first-child):hover {
    color: var(--accent);
  }

  nav a.button {
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
  }

  nav a.button:hover {
    background: var(--accent-hover);
    color: #fff;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 24px;
    text-align: center;
  }

  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }

  main p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="signup.html" class="button">Signup</a>
  </nav>

  <main>
    <h1>Welcome</h1>
    <p>This is the home page. Use the navigation above to log in or create a new account.</p>
  </main>

</body>
</html>
